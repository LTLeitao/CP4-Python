<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão da Academia</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <h1>🏋️‍♂️ Sistema de Gestão - Academia</h1>
    <div id="mensagem" class="mensagem oculta"></div>

    <section class="card">
      <h2 id="form-titulo">Cadastrar Novo Aluno</h2>
      <form id="user-form">
        <input type="hidden" id="user-id">

        <div class="form-group">
          <label for="address">Endereço:</label>
          <input type="text" id="address" placeholder="Rua Exemplo, 123" required minlength="3">
        </div>

        <div class="form-group">
          <label for="email">E-mail:</label>
          <input type="email" id="email" placeholder="aluno@email.com" required>
        </div>

        <div class="form-group">
          <label for="cpf">CPF (11 dígitos):</label>
          <input type="text" id="cpf" placeholder="12345678901" pattern="\d{11}" maxlength="11" required>
        </div>

        <div class="form-group">
            <label for="plan_id">Plano:</label>
            <select id="plan_id" required>
                <option value="">Carregando planos...</option>
            </select>
        </div>

        <div class="botoes">
          <button type="submit" id="btn-salvar" class="btn btn-primary">Salvar Aluno</button>
          <button type="button" id="btn-cancelar" class="btn btn-secondary oculta" onclick="limparFormulario()">Cancelar Edição</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Alunos Cadastrados</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Endereço</th>
            <th>E-mail</th>
            <th>CPF</th>
            <th>Plano ID</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-usuarios">
        </tbody>
      </table>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
